name: Build & Release Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi

      - name: Prepare debug keystore and env file
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env.example ]; then
            touch .env.example
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare downloadable APK artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DPBoss-Smart-Analytics.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPBoss-Smart-Analytics-APK
          path: DPBoss-Smart-Analytics.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DPBoss Smart Analytics v1.0.${{ github.run_number }}
          body: |
            Automated Android APK build for **DPBoss Smart Analytics**.
            Download `DPBoss-Smart-Analytics.apk` below to install on Android.
          files: DPBoss-Smart-Analytics.apk
          make_latest: true
