name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"

          JAVA_VERSION_LINE=$(java -version 2>&1 | head -n 1 || true)
          JAVA_VERSION=$(printf '%s\n' "$JAVA_VERSION_LINE" | sed -nE 's/.*version "([^"]+)".*/\1/p')
          if [ -z "$JAVA_VERSION" ]; then
            echo "::error::Failed to detect active Java version from: ${JAVA_VERSION_LINE}"
            exit 1
          fi

          if [[ "$JAVA_VERSION" == 1.* ]]; then
            JAVA_MAJOR=$(printf '%s' "$JAVA_VERSION" | cut -d'.' -f2)
          else
            JAVA_MAJOR=$(printf '%s' "$JAVA_VERSION" | cut -d'.' -f1)
          fi

          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to parse active Java major version from: ${JAVA_VERSION}"
            exit 1
          fi

          echo "Detected active Java major version: ${JAVA_MAJOR}"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java ${JAVA_MAJOR} (${JAVA_VERSION})."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists; skipping generation."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              echo "::error::keytool not found in configured Java 17 installation (${KEYTOOL_BIN})."
              exit 1
            fi

            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Temporary debug keystore could not be created at ./debug.keystore."
            exit 1
          fi

          echo "Confirmed ./debug.keystore exists."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK does not exist at ${EXPECTED_APK}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have the .apk extension."
            exit 1
          fi

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Selected APK path does not match app/build/outputs/apk/debug/app-debug.apk."
            exit 1
          fi

          APK_BYTES=$(wc -c < "$EXPECTED_APK")
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_BYTES} bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified debug APK is missing or empty: ${SOURCE_APK}"
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(printf '%s' "$RAW_REPO_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^-+//; s/-+$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          RELEASE_ASSET_DIR=$(mktemp -d "${RUNNER_TEMP}/apk-release-asset.XXXXXX")
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${RELEASE_ASSET_DIR}/${ASSET_FILENAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset is invalid: ${ASSET_PATH}"
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_filename=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset filename: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          RELEASE_ASSET_FILENAME: ${{ steps.prepare_release_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi
          gh --version

          if [ -z "${RELEASE_ASSET_PATH:-}" ] || [ ! -f "$RELEASE_ASSET_PATH" ] || [ ! -s "$RELEASE_ASSET_PATH" ] || [[ "$RELEASE_ASSET_PATH" != *.apk ]]; then
            echo "::warning::Prepared APK release asset failed validation; skipping GitHub Release creation."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES=$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}
          - **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **APK Asset:** ${RELEASE_ASSET_FILENAME}

          **Important Notes:**
          - This APK is intended for testing only.
          - This APK is not a Play Store production release.
          - This APK is signed only with a temporary debug keystore generated during the GitHub Actions run.
          EOF
          )

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          gh release create "$RELEASE_TAG" "$RELEASE_ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: ${{ !cancelled() && (steps.publish_release.outcome == 'success' || steps.publish_release.outcome == 'failure') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          RELEASE_ASSET_FILENAME: ${{ steps.prepare_release_asset.outputs.asset_filename }}
        run: |
          set -euo pipefail

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            if [ -z "${RELEASE_TAG:-}" ]; then
              RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            fi
            if [ -z "${RELEASE_TITLE:-}" ]; then
              RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
            fi

            if RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>/dev/null) && [ -n "$RELEASE_URL" ]; then
              gh release view "$RELEASE_TAG"
              echo "Release Tag: ${RELEASE_TAG}"
              echo "Release Title: ${RELEASE_TITLE}"
              echo "Release Page URL: ${RELEASE_URL}"
              echo "APK Asset Filename: ${RELEASE_ASSET_FILENAME}"

              {
                echo "## Debug APK Build & Release Summary"
                echo ""
                echo "- **Status:** APK build, Actions artifact upload, and GitHub Release publishing succeeded."
                echo "- **Release Tag:** \`${RELEASE_TAG}\`"
                echo "- **Release Title:** ${RELEASE_TITLE}"
                echo "- **Release Page URL:** ${RELEASE_URL}"
                echo "- **APK Asset Filename:** \`${RELEASE_ASSET_FILENAME}\`"
                echo ""
                echo "Download the APK directly from the **Assets** section on the GitHub Release page above."
                echo ""
                echo "The standard GitHub Actions artifact (\`app-debug-apk\`) is also available on this workflow run as a backup."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Release publishing completed, but the release could not be verified with gh release view. The APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
              {
                echo "## Debug APK Build & Release Summary"
                echo ""
                echo "- **Status:** APK build and Actions artifact upload succeeded, but GitHub Release verification failed."
                echo "- **Backup Download:** Download the debug APK from the GitHub Actions artifact named \`app-debug-apk\` on this workflow run."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::GitHub Release publishing failed. The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available."
            {
              echo "## Debug APK Build & Release Summary"
              echo ""
              echo "- **Warning:** GitHub Release publishing failed."
              echo "- **Build Status:** The debug APK build and Actions artifact upload succeeded."
              echo "- **Backup Download:** Download the debug APK from the GitHub Actions artifact named \`app-debug-apk\` on this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
